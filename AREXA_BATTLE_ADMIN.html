label{display:block;color:#c8d2e1;font-size:13px;margin:12px 0 6px}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #34445c;background:#080e18;color:white;font:inherit}

.nav{display:flex;gap:8px;overflow:auto;padding:14px 0}.nav button{white-space:nowrap}.hidden{display:none!important}.tag{font-size:11px;border:1px solid #46566c;padding:4px 8px;border-radius:20px;color:#d8e1ee}.stat{font-size:24px;font-weight:900;color:var(--gold)}

@media(max-width:600px){h1{font-size:25px}.wrap{padding:12px 12px 40px}.top{align-items:flex-start}}

<script>
const STORE='arexa_battle_three_apps_demo_v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data=JSON.parse(localStorage.getItem(STORE)||'null')||{admin:{username:'AREXAADMIN',passHash:''},organizers:[],players:[],tournaments:[]};
data.withdrawals=data.withdrawals||[]; data.coinRequests=data.coinRequests||[]; data.depositRequests=data.depositRequests||[]; data.transactions=data.transactions||[]; data.paymentSettings=data.paymentSettings||{}; data.players.forEach(p=>{if(typeof p.demoCoins!=='number')p.demoCoins=0});
function save(){arexaSaveCloud();render()}
function toast(s){let t=$('toast');if(!t)return;t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
async function hash(s){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const SESSION_KEY='arexa_admin_session';
function session(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch{return null}}
function setSession(v){localStorage.setItem(SESSION_KEY,JSON.stringify(v))}
function logout(){localStorage.removeItem(SESSION_KEY);location.reload()}
function current(){let s=session();if(!s)return null;if(s.role==='admin')return data.admin;if(s.role==='organizer')return data.organizers.find(x=>x.username===s.username)||null;return data.players.find(x=>x.username===s.username)||null}
function loginBox(title,role,extra=''){return `<div class="card"><h2>${title}</h2>${extra}<div class="field"><label>Username</label><input id="loginUser" autocomplete="username" placeholder="${role==='admin'?'AREXAADMIN':'Username'}" value="${role==='admin'?'AREXAADMIN':''}"></div><div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password"></div><button class="btn" onclick="doLogin('${role}')">Login</button></div>`}
async function doLogin(role){let u=$('loginUser').value.trim(),p=$('loginPass').value;if(!u||!p){toast('Username and password required');return}if(role==='admin'&&!data.admin.passHash){if(p.length<8){toast('First-time Admin password must be at least 8 characters');return}data.admin.passHash=await hash(p);localStorage.setItem(STORE,JSON.stringify(data));if(arexaCloudReady)arexaSaveCloud()}let user=role==='admin'?data.admin:role==='organizer'?data.organizers.find(x=>x.username.toLowerCase()===u.toLowerCase()):data.players.find(x=>x.username.toLowerCase()===u.toLowerCase());let h=await hash(p);if(!user||user.passHash!==h){toast('Login details not found');return}setSession({role,username:user.username});location.reload()}
function statusTag(s){return `<span class="tag">${esc(s)}</span>`}
function playerSignup(){return `<div class="card"><h2>Player signup</h2><label>Username</label><input id="newPlayer" maxlength="24"><label>Password (8+ characters)</label><input id="newPlayerPass" type="password"><button class="btn" onclick="createPlayer()">Create player account</button></div>`}
async function createPlayer(){let u=$('newPlayer').value.trim(),p=$('newPlayerPass').value;if(u.length<3||p.length<8){toast('Username 3+ and password 8+ required');return}if(data.players.some(x=>x.username.toLowerCase()===u.toLowerCase())||u.toLowerCase()==='arexaadmin'){toast('Username already exists');return}data.players.push({username:u,passHash:await hash(p),created:new Date().toLocaleString()});save();toast('Player account created. Login now.')}

function render(){let c=current(),root=$('app');if(!c||!session()||session().role!=='admin'){root.innerHTML=loginBox('Main Admin Login','admin','<div class="notice">Admin username is AREXAADMIN. First use: choose an 8+ character password. No Gmail login.</div>');return}
root.innerHTML=`<div class="grid"><div class="card"><div class="stat">${data.organizers.length}</div><div class="muted">Organizers</div></div><div class="card"><div class="stat">${data.players.length}</div><div class="muted">Players</div></div><div class="card"><div class="stat">${data.tournaments.length}</div><div class="muted">Tournaments</div></div></div>
<div class="card"><h2>🏆 Admin: Create Tournament</h2><p class="small muted">Create and publish tournaments directly from the Main Admin account.</p>
<label>Tournament name</label><input id="admTName" maxlength="60" placeholder="AREXA Custom Cup">
<div class="grid"><div><label>Category</label><select id="admTCategory"><option>BR RANK</option><option>CS CUSTOM</option><option>LOW</option></select></div><div><label>Game</label><input id="admTGame" value="Free Fire"></div>
<div><label>Mode</label><select id="admTMode"><option>BR Survival</option><option>BR Per Kill</option><option>BR Solo Rank</option><option>BR Duo Rank</option><option>BR Squad Rank</option><option>1v1 Custom</option><option>2v2 Custom</option><option>4v4 Custom</option><option>1v1 Headshot Only</option><option>2v2 Headshot Only</option><option>4v4 Headshot Only</option><option>Solo</option><option>Duo</option><option>Squad</option><option>Custom Room</option><option>1v1</option><option>2v2</option><option>4v4</option></select></div>
<div><label>Date and time</label><input id="admTDate" type="datetime-local"></div><div><label>Maximum players</label><input id="admTMax" type="number" min="2" max="100" value="48"></div><div><label>Entry Fee (Coins)</label><input id="admTFee" type="number" min="0" step="1" value="0"></div></div>
<label>Room ID (optional)</label><input id="admRoomId" maxlength="40" placeholder="Enter custom room ID"><label>Room Password (optional)</label><input id="admRoomPass" maxlength="80" placeholder="Enter room password">
<label>Prize description</label><input id="admTPrize" placeholder="e.g. AREXA points"><label>Rules / description</label><textarea id="admTRules" placeholder="Rules, map, rounds, eligibility..."></textarea>
<button class="btn good" onclick="adminCreateTournament()">Create & Publish Tournament</button></div>
<div class="card"><h2>💳 Wallet Payment Settings</h2><p class="small muted">Add or update the payment QR and UPI ID. These details will appear in the Player Wallet when both apps are hosted on the same website origin.</p><label>UPI ID</label><input id="payUpi" value="${esc(data.paymentSettings.upiId||'')}" placeholder="yourname@bank"><label>Payee Name</label><input id="payeeName" value="${esc(data.paymentSettings.payeeName||'')}" placeholder="AREXA BATTLE"><label>Payment Instructions</label><textarea id="payInstructions" placeholder="Enter payment instructions">${esc(data.paymentSettings.instructions||'')}</textarea><label>Upload Payment QR Image</label><input id="payQrFile" type="file" accept="image/png,image/jpeg,image/webp"><div class="small muted">${data.paymentSettings.qrData?'Current QR is saved. Upload a new image to replace it.':'No QR image uploaded yet.'}</div>${data.paymentSettings.qrData?`<img src="${data.paymentSettings.qrData}" alt="Current payment QR" style="width:170px;max-width:100%;background:white;padding:6px;border-radius:10px;margin-top:8px">`:''}<button class="btn" onclick="savePaymentSettings()">Save Payment Details</button></div>
<div class="card"><h2>Tournament Approval Queue</h2><div id="pendingTours"></div></div><div class="card"><h2>All Tournaments</h2><div id="allTours"></div></div><div class="card"><h2>Demo Coin Requests</h2><div id="coinRequestQueue"></div></div><div class="card"><h2>Deposit Approval Queue</h2><div id="depositQueue"></div></div><div class="card"><h2>Withdrawal Requests</h2><div id="withdrawalQueue"></div></div><div class="card"><h2>Players</h2><div id="playersList"></div></div><div class="notice">Payment QR and UPI details are displayed for payer reference only. Payment confirmation and coin credit must be verified by Admin.</div><button class="btn alt" onclick="logout()">Logout</button>`;

$('pendingTours').innerHTML=data.tournaments.filter(t=>t.status==='Pending Admin Approval').map(t=>`<div class="item"><b>${esc(t.name)}</b> ${statusTag(t.status)}<p class="small muted">By ${esc(t.organizer)} • ${esc(t.game)} • ${esc(t.mode)} • ${esc(t.date)}</p><button class="btn good" onclick="approveTour(${t.id})">Approve</button><button class="btn warn" onclick="rejectTour(${t.id})">Reject</button></div>`).join('')||'<p class="muted">No pending tournaments.</p>';
$('allTours').innerHTML=data.tournaments.map(t=>`<div class="item"><div class="row"><b>${esc(t.name)}</b>${statusTag(t.status)}</div><p class="small muted">Organizer: ${esc(t.organizer||'Main Admin')} • ${esc(t.game)} • ${esc(t.mode)} • Players: ${t.players.length}/${t.maxPlayers}</p><div class="grid"><div><label>Room ID</label><input id="roomId_${t.id}" value="${esc(t.roomId||'')}" placeholder="Room ID"></div><div><label>Room Password</label><input id="roomPass_${t.id}" value="${esc(t.roomPassword||'')}" placeholder="Room Password"></div></div><div class="row"><button class="btn good" onclick="saveRoomDetails(${t.id})">Save Room Details</button><button class="btn alt" onclick="setTournamentStatus(${t.id},'Open')">Publish / Open</button><button class="btn warn" onclick="setTournamentStatus(${t.id},'Closed')">Close</button></div></div>`).join('')||'<p class="muted">No tournaments yet.</p>';
$('coinRequestQueue').innerHTML=data.coinRequests.slice().reverse().map(r=>`<div class="item"><div class="row"><b>${esc(r.username)} — 🪙 ${Number(r.coins).toLocaleString('en-IN')} demo coins</b>${statusTag(r.status)}</div><p class="small muted">${esc(r.created)}</p>${r.status==='Pending'?`<button class="btn good" onclick="approveCoinRequest(${r.id})">Approve</button><button class="btn warn" onclick="rejectCoinRequest(${r.id})">Reject</button>`:''}</div>`).join('')||'<p class="muted">No pending coin requests.</p>';$('depositQueue').innerHTML=(data.depositRequests||[]).slice().reverse().map(r=>`<div class="item"><b>${esc(r.username)} · ₹${r.amount} / ${r.coins} Coins</b> ${statusTag(r.status)}<p class="small muted">UTR: ${esc(r.utr)} · ${esc(r.created)}</p>${r.status==='Pending'?`<button class="btn good" onclick="approveDeposit(${r.id})">Approve & Add Coins</button><button class="btn warn" onclick="rejectDeposit(${r.id})">Reject</button>`:''}</div>`).join('')||'<p class="muted">No deposit requests.</p>';$('withdrawalQueue').innerHTML=data.withdrawals.slice().reverse().map(w=>{let p=data.players.find(x=>x.username===w.username);return `<div class="item"><div class="row"><b>${esc(w.username)} — 🪙 ${Number(w.coins).toLocaleString('en-IN')} demo coins</b>${statusTag(w.status)}</div><p class="small muted">${esc(w.created)}</p>${w.status==='Pending'?`<button class="btn good" onclick="approveWithdrawal(${w.id})">Approve</button><button class="btn warn" onclick="rejectWithdrawal(${w.id})">Reject</button>`:''}${w.status==='Approved'?'<p class="small muted">Coins paid / request approved.</p>':''}</div>`}).join('')||'<p class="muted">No withdrawal requests.</p>';
$('playersList').innerHTML=data.players.map(p=>`<div class="item"><div class="row"><b>${esc(p.username)}</b><span class="tag">🪙 ${Number(p.demoCoins||0).toLocaleString('en-IN')} demo coins</span></div><div class="small muted">${esc(p.created||'')}</div><div class="row" style="margin-top:8px"><input id="coins_${esc(p.username)}" type="number" min="1" step="1" placeholder="Coins amount" style="max-width:140px"><button class="btn alt" onclick="adjustCoins('${esc(p.username)}',1)">Add Coins</button><button class="btn warn" onclick="adjustCoins('${esc(p.username)}',-1)">Deduct Coins</button></div></div>`).join('')||'<p class="muted">No players yet.</p>'}
async function savePaymentSettings(){let upi=$('payUpi').value.trim(),payee=$('payeeName').value.trim(),instructions=$('payInstructions').value.trim(),file=$('payQrFile').files[0];if(upi&&!/^[A-Za-z0-9._-]{2,256}@[A-Za-z0-9.-]{2,64}$/.test(upi)){toast('Enter a valid UPI ID');return}let finish=(qr)=>{data.paymentSettings={upiId:upi,payeeName:payee,instructions,qrData:qr||data.paymentSettings.qrData||''};save();toast('Wallet payment details updated')};if(file){if(file.size>1200000){toast('QR image must be smaller than 1.2 MB');return}if(!file.type.startsWith('image/')){toast('Please choose an image file');return}let reader=new FileReader();reader.onload=()=>finish(String(reader.result));reader.onerror=()=>toast('Could not read QR image');reader.readAsDataURL(file)}else finish('')}
async function createOrganizer(){let u=$('orgUser').value.trim(),p=$('orgPass').value,n=$('orgName').value.trim();if(u.length<3||p.length<8){toast('Username 3+ and password 8+ required');return}if(data.organizers.some(x=>x.username.toLowerCase()===u.toLowerCase())||u.toLowerCase()==='arexaadmin'){toast('Username already used');return}data.organizers.push({username:u,name:n,passHash:await hash(p),created:new Date().toLocaleString()});save();toast('Organizer account created')}
function downloadOrganizerLogin(username){const o=data.organizers.find(x=>x.username.toLowerCase()===String(username).toLowerCase());if(!o){toast('Organizer not found');return}const payload={app:'AREXA_BATTLE_ORGANIZER_LOGIN',version:1,organizer:o};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='AREXA_ORGANIZER_'+o.username+'.json';a.click();URL.revokeObjectURL(url);toast('Login file exported. Send it privately to Organizer.')}
function removeOrganizer(u){if(!confirm('Remove organizer '+u+'?'))return;data.organizers=data.organizers.filter(x=>x.username!==u);save()}
function addDemoCoins(username){let p=data.players.find(x=>x.username===username),n=Number($('coins_'+username)?.value);if(!p||!Number.isSafeInteger(n)||n<1){toast('Enter a valid whole number of demo coins');return}p.demoCoins=Number(p.demoCoins||0)+n;data.transactions.push({id:Date.now(),username,kind:'Admin added demo coins',coins:n,created:new Date().toLocaleString()});save();toast('Demo coins added')}
function approveCoinRequest(id){let r=data.coinRequests.find(x=>x.id===id&&x.status==='Pending');if(!r)return;let p=data.players.find(x=>x.username===r.username);if(!p){r.status='Rejected';save();toast('Player not found');return}p.demoCoins=Number(p.demoCoins||0)+r.coins;r.status='Approved';r.reviewedBy='Main Admin';r.reviewed=new Date().toLocaleString();data.transactions.push({id:Date.now(),username:r.username,kind:'Demo coin request approved',coins:r.coins,created:new Date().toLocaleString()});save();toast('Demo coin request approved')}
function rejectCoinRequest(id){let r=data.coinRequests.find(x=>x.id===id&&x.status==='Pending');if(!r)return;r.status='Rejected';r.reviewedBy='Main Admin';r.reviewed=new Date().toLocaleString();save();toast('Demo coin request rejected')}
function approveWithdrawal(id){let w=data.withdrawals.find(x=>x.id===id&&x.status==='Pending');if(!w)return;w.status='Approved';w.reviewed=new Date().toLocaleString();w.reviewedBy='Main Admin';save();toast('Withdrawal approved')}
function rejectWithdrawal(id){let w=data.withdrawals.find(x=>x.id===id&&x.status==='Pending');if(!w)return;let p=data.players.find(x=>x.username===w.username);if(p&&w.held){p.demoCoins=Number(p.demoCoins||0)+w.coins;data.transactions.push({id:Date.now(),username:w.username,kind:'Withdrawal rejected - coins refunded',coins:w.coins,created:new Date().toLocaleString()})}w.status='Rejected';w.reviewed=new Date().toLocaleString();save();toast('Withdrawal rejected; coins refunded')}
function adjustCoins(username,sign){let p=data.players.find(x=>x.username===username),n=Number($('coins_'+username)?.value);if(!p||!Number.isSafeInteger(n)||n<1){toast('Enter a valid coin amount');return}if(sign<0&&Number(p.demoCoins||0)<n){toast('Player does not have enough coins');return}p.demoCoins=Number(p.demoCoins||0)+sign*n;data.transactions.push({id:Date.now(),username,kind:sign>0?'Admin added coins':'Admin deducted coins',coins:sign*n,created:new Date().toLocaleString()});save();toast('Player coin balance updated')}
function approveDeposit(id){let r=(data.depositRequests||[]).find(x=>x.id===id&&x.status==='Pending');if(!r)return;let p=data.players.find(x=>x.username===r.username);if(!p){r.status='Rejected';save();return}p.demoCoins=Number(p.demoCoins||0)+Number(r.coins);r.status='Approved';r.reviewedBy='Main Admin';r.reviewed=new Date().toLocaleString();data.transactions.push({id:Date.now(),username:r.username,kind:'Deposit approved',coins:Number(r.coins),created:new Date().toLocaleString()});save();toast('Deposit approved; coins added')}
function rejectDeposit(id){let r=(data.depositRequests||[]).find(x=>x.id===id&&x.status==='Pending');if(!r)return;r.status='Rejected';r.reviewedBy='Main Admin';r.reviewed=new Date().toLocaleString();save();toast('Deposit rejected')}
function approveTour(id){let t=data.tournaments.find(x=>x.id===id);if(t){t.status='Open';save();toast('Tournament approved')}}
function rejectTour(id){let t=data.tournaments.find(x=>x.id===id);if(t){t.status='Rejected';save();toast('Tournament rejected')}}

function adminCreateTournament(){
 const name=$('admTName').value.trim(),game=$('admTGame').value.trim(),date=$('admTDate').value;
 const max=Number($('admTMax').value),entryFee=Number($('admTFee').value);
 if(!name||!game||!date||max<2||max>100||!Number.isInteger(max)||!Number.isSafeInteger(entryFee)||entryFee<0){toast('Tournament name, game, date, player limit (2-100) and valid fee are required');return}
 const id=Date.now();
 data.tournaments=data.tournaments||[];
 data.tournaments.push({id,name,game,category:$('admTCategory').value,mode:$('admTMode').value,date,organizer:'MAIN ADMIN',createdBy:'MAIN ADMIN',createdAt:new Date().toISOString(),maxPlayers:max,entryFee,roomId:$('admRoomId').value.trim(),roomPassword:$('admRoomPass').value.trim(),rules:$('admTRules').value.trim(),prize:$('admTPrize').value.trim(),players:[],status:'Open'});
 save();
 ['admTName','admTDate','admRoomId','admRoomPass','admTPrize','admTRules'].forEach(id=>{const el=$(id);if(el)el.value=''});
 $('admTMax').value='48';$('admTFee').value='0';
 toast('Success! Main Admin tournament created and published for Players.');
}
function saveRoomDetails(id){let t=data.tournaments.find(x=>x.id===id);if(!t)return;t.roomId=$('roomId_'+id).value.trim();t.roomPassword=$('roomPass_'+id).value.trim();save();toast('Room ID and password saved')}
function setTournamentStatus(id,status){let t=data.tournaments.find(x=>x.id===id);if(!t)return;t.status=status;save();toast('Tournament status updated')}


/* AREXA shared Firebase sync — same database path in all three panels */
const AREXA_CLOUD_PATH = 'arexaBattle/sharedData';
let arexaCloudReady = false;
let arexaApplyingRemote = false;
function arexaNormalize(d){
 d=d&&typeof d==='object'?d:{};
 d.admin=d.admin||{username:'AREXAADMIN',passHash:''};
 for(const k of ['organizers','players','tournaments','withdrawals','coinRequests','depositRequests','transactions']) if(!Array.isArray(d[k])) d[k]=[];
 d.paymentSettings=d.paymentSettings||{};
 d.players.forEach(p=>{if(typeof p.demoCoins!=='number')p.demoCoins=0;});
 return d;
}
async function arexaStartSync(){
 try{
  const ref=window.arexaDb.ref(AREXA_CLOUD_PATH);
  const snap=await ref.once('value');
  const local=arexaNormalize(data);
  if(snap.exists()){
   const cloud=arexaNormalize(snap.val());
   // Preserve a previously configured local Admin password; otherwise use cloud credentials.
   const localAdminHash=local.admin && local.admin.passHash;
   data=cloud;
   if(localAdminHash) data.admin={...cloud.admin,...local.admin,passHash:localAdminHash};
   // Keep local data if cloud collection is empty, preventing accidental first-sync data loss.
   for(const k of ['organizers','players','tournaments','withdrawals','coinRequests','depositRequests','transactions']) if(!data[k].length && local[k].length) data[k]=local[k];
   if(!Object.keys(data.paymentSettings||{}).length && Object.keys(local.paymentSettings||{}).length) data.paymentSettings=local.paymentSettings;
   await ref.set(data);
  }else{
   data=local;
   await ref.set(data);
  }
  localStorage.setItem(STORE,JSON.stringify(data));
  arexaCloudReady=true;
  if(typeof render==='function')render();
  ref.on('value',s=>{
   if(arexaApplyingRemote||!s.exists())return;
   const incoming=arexaNormalize(s.val());
   if(JSON.stringify(incoming)!==JSON.stringify(data)){
    arexaApplyingRemote=true; data=incoming; localStorage.setItem(STORE,JSON.stringify(data));
    if(typeof render==='function')render();
    arexaApplyingRemote=false;
   }
  },e=>{console.error('AREXA Firebase listener:',e);if(typeof toast==='function')toast('Firebase read blocked — check Database Rules');});
  if(typeof toast==='function')toast('Firebase connected — shared data loaded');
 }catch(e){console.error('AREXA Firebase sync failed:',e);arexaCloudReady=false;if(typeof toast==='function')toast('Firebase unavailable. Local mode active.');}
}
function arexaSaveCloud(){
 localStorage.setItem(STORE,JSON.stringify(data));
 if(!arexaCloudReady||arexaApplyingRemote)return;
 window.arexaDb.ref(AREXA_CLOUD_PATH).set(data).catch(e=>{console.error('AREXA Firebase write:',e);if(typeof toast==='function')toast('Firebase save failed — check Database Rules');});
}
window.addEventListener('storage',e=>{if(e.key===STORE&&e.newValue){try{data=arexaNormalize(JSON.parse(e.newValue));if(typeof render==='function')render();}catch(_){}}});

render();
arexaStartSync();
