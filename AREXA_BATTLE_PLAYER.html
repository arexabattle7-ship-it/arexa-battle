<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AREXA BATTLE</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04050f;--bg2:#080b1a;--bg3:#0d1128;
  --gold:#f0c040;--gold2:#ffdc45;--gold3:#ffe87a;
  --purple:#7c3aed;--purple2:#a855f7;--purple3:#c084fc;
  --red:#ef4444;--green:#22c55e;--blue:#3b82f6;
  --text:#f0eeff;--muted:#8b80a8;--muted2:#b0a8cc;
  --border:#1e1a35;--border2:#2d2650;
  --card:linear-gradient(145deg,#0d1128,#080b1a);
  --gold-grad:linear-gradient(90deg,#f0c040,#ffdc45,#ffe87a);
  --purple-grad:linear-gradient(135deg,#7c3aed,#a855f7);
  --hero-grad:linear-gradient(135deg,#0d0820 0%,#1a0a3d 50%,#0d1128 100%);
  --glow:0 0 24px #7c3aed55;--glow-gold:0 0 20px #f0c04044;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Rajdhani',Arial,sans-serif;font-size:15px;min-height:100vh;overflow-x:hidden}
.wrap{max-width:430px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:76px;position:relative}

/* TOP BAR */
.top{position:sticky;top:0;z-index:20;background:rgba(4,5,15,0.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border2);padding:0 16px}
.top-inner{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:34px;height:34px;background:var(--purple-grad);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:var(--glow)}
.brand-text{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:900;letter-spacing:1px;color:var(--text)}
.brand-text span{color:var(--gold)}
.brand-sub{font-size:9px;color:var(--muted);letter-spacing:2px;margin-top:1px}
.top-right{display:flex;align-items:center;gap:10px}
.coin-pill{background:linear-gradient(135deg,#1a1430,#0d1128);border:1px solid var(--border2);border-radius:20px;padding:6px 12px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:var(--gold2)}
.coin-pill .coin-icon{font-size:14px}
.avatar-btn{width:34px;height:34px;border-radius:50%;background:var(--purple-grad);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;box-shadow:var(--glow-gold)}

/* NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);background:rgba(4,5,15,0.97);backdrop-filter:blur(20px);border-top:1px solid var(--border2);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 4px;z-index:20;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.nav-btn{border:0;background:none;color:var(--muted);font-size:9px;font-family:'Rajdhani',sans-serif;font-weight:600;padding:4px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s;letter-spacing:.5px;text-transform:uppercase}
.nav-btn .ico{font-size:20px;line-height:1}
.nav-btn.active{color:var(--gold2)}
.nav-btn.active .ico{filter:drop-shadow(0 0 6px #f0c04099)}

/* SECTION */
#app{padding:0}

/* HERO */
.hero-section{background:var(--hero-grad);padding:20px 16px 24px;position:relative;overflow:hidden;border-bottom:1px solid var(--border2)}
.hero-section::before{content:'';position:absolute;top:-40px;right:-40px;width:200px;height:200px;background:radial-gradient(circle,#7c3aed22,transparent 70%);border-radius:50%;pointer-events:none}
.hero-section::after{content:'';position:absolute;bottom:-30px;left:-30px;width:160px;height:160px;background:radial-gradient(circle,#f0c04015,transparent 70%);border-radius:50%;pointer-events:none}
.hero-greet{font-size:12px;color:var(--muted2);letter-spacing:1px;margin-bottom:4px}
.hero-name{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;line-height:1.1;margin-bottom:14px}
.hero-name span{color:var(--gold)}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-box{background:rgba(255,255,255,0.04);border:1px solid var(--border2);border-radius:14px;padding:12px 10px;text-align:center;position:relative;overflow:hidden}
.stat-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--gold-grad);opacity:.7}
.stat-val{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;color:var(--gold2);line-height:1}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:.5px}
.hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* BUTTONS */
.btn-primary{border:0;border-radius:12px;padding:13px 16px;background:var(--gold-grad);color:#1a0a00;font-size:14px;font-weight:900;cursor:pointer;width:100%;font-family:'Rajdhani',sans-serif;letter-spacing:.5px;box-shadow:var(--glow-gold);transition:opacity .2s}
.btn-primary:active{opacity:.85}
.btn-secondary{border:1px solid var(--border2);border-radius:12px;padding:13px 16px;background:rgba(124,58,237,.12);color:var(--purple3);font-size:14px;font-weight:700;cursor:pointer;width:100%;font-family:'Rajdhani',sans-serif;letter-spacing:.5px;transition:border-color .2s}
.btn-secondary:active{border-color:var(--purple2)}
.btn-outline{border:1px solid var(--border2);border-radius:10px;padding:10px 14px;background:transparent;color:var(--muted2);font-size:13px;font-weight:600;cursor:pointer;font-family:'Rajdhani',sans-serif;transition:border-color .2s;width:100%;margin-top:6px}
.btn-outline:active{border-color:var(--gold)}

/* CARDS */
.section{padding:16px}
.section-title{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.card-gold{border-color:#f0c04030;background:linear-gradient(145deg,#1a1020,#0d0820)}
.card-gold::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--gold-grad);opacity:.5}

/* TOURNAMENT CARD */
.tour-card{background:var(--card);border:1px solid var(--border);border-radius:18px;margin-bottom:14px;overflow:hidden;position:relative}
.tour-header{padding:14px 16px 10px;background:linear-gradient(135deg,#1a0a3d,#0d1128)}
.tour-header::after{content:'';position:absolute;top:0;right:0;width:80px;height:80px;background:radial-gradient(circle,#7c3aed20,transparent);border-radius:50%}
.tour-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(124,58,237,.2);border:1px solid #7c3aed55;border-radius:20px;padding:4px 10px;font-size:10px;color:var(--purple3);font-weight:700;letter-spacing:.5px;margin-bottom:8px}
.tour-name{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:900;line-height:1.2;margin-bottom:4px}
.tour-meta{font-size:11px;color:var(--muted2)}
.tour-body{padding:12px 16px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--border)}
.tour-stat{text-align:center}
.tour-stat-val{font-weight:900;font-size:16px;color:var(--gold2)}
.tour-stat-lbl{font-size:9px;color:var(--muted);letter-spacing:.5px;margin-top:2px}
.tour-footer{padding:10px 16px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status-badge{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:4px 10px;font-size:10px;font-weight:700;letter-spacing:.5px}
.status-open{background:rgba(34,197,94,.12);border:1px solid #22c55e44;color:#22c55e}
.status-closed{background:rgba(239,68,68,.12);border:1px solid #ef444444;color:#ef4444}
.status-done{background:rgba(107,114,128,.12);border:1px solid #6b728044;color:#9ca3af}
.live-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.8)}}

/* LEADERBOARD */
.lb-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.lb-row:last-child{border:0}
.lb-rank{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;width:28px;text-align:center;color:var(--muted)}
.lb-rank.top1{color:#ffd700;text-shadow:0 0 10px #ffd70088}
.lb-rank.top2{color:#c0c0c0}
.lb-rank.top3{color:#cd7f32}
.lb-avatar{width:36px;height:36px;border-radius:50%;background:var(--purple-grad);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;border:1.5px solid var(--border2)}
.lb-info{flex:1;min-width:0}
.lb-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-sub{font-size:11px;color:var(--muted)}
.lb-coins{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;color:var(--gold2)}

/* WALLET */
.wallet-bal{text-align:center;padding:20px;background:linear-gradient(135deg,#1a0a3d,#0d0820);border-radius:18px;border:1px solid #f0c04025;position:relative;overflow:hidden;margin-bottom:14px}
.wallet-bal::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:radial-gradient(circle,#f0c04020,transparent);border-radius:50%}
.bal-label{font-size:11px;color:var(--muted);letter-spacing:2px;margin-bottom:8px}
.bal-amount{font-family:'Orbitron',sans-serif;font-size:36px;font-weight:900;color:var(--gold2);text-shadow:0 0 30px #f0c04055;line-height:1}
.bal-sub{font-size:11px;color:var(--muted2);margin-top:6px}

/* FORM */
.field{margin:12px 0}
.field label{display:block;font-size:12px;color:var(--muted2);letter-spacing:.5px;margin-bottom:7px;font-weight:600}
.field input{width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--border2);background:rgba(13,17,40,.8);color:var(--text);font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:500;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--purple2)}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:rgba(13,17,40,.8);border-radius:14px;padding:4px;margin-bottom:16px}
.auth-tab{border:0;border-radius:11px;padding:12px;font-weight:800;font-size:14px;cursor:pointer;font-family:'Rajdhani',sans-serif;transition:all .2s}
.auth-tab.active{background:var(--gold-grad);color:#1a0a00}
.auth-tab:not(.active){background:none;color:var(--muted2)}

/* TOAST */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a1430;border:1px solid var(--purple2);border-radius:14px;padding:12px 18px;display:none;z-index:30;font-size:13px;font-weight:600;text-align:center;max-width:88%;box-shadow:0 4px 24px #7c3aed44;color:var(--text)}

/* NOTICE */
.notice{background:rgba(240,192,64,.06);border:1px solid #f0c04030;border-radius:14px;padding:14px;font-size:13px;color:#f0c090;line-height:1.5;margin:12px 0}
.notice b{color:var(--gold2)}

/* PROFILE */
.profile-banner{background:var(--hero-grad);border-radius:18px;padding:20px 16px;text-align:center;border:1px solid var(--border2);margin-bottom:12px;position:relative;overflow:hidden}
.profile-banner::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--gold-grad)}
.p-avatar{font-size:52px;margin-bottom:8px;line-height:1}
.p-name{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;margin-bottom:3px}
.p-username{font-size:12px;color:var(--muted2)}
.p-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.p-stat{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center}
.p-stat-val{font-family:'Orbitron',sans-serif;font-size:17px;font-weight:900;color:var(--gold2)}
.p-stat-lbl{font-size:9px;color:var(--muted);margin-top:3px;letter-spacing:.5px}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);gap:12px}
.info-row:last-child{border:0}
.info-label{font-size:12px;color:var(--muted);flex-shrink:0}
.info-val{font-size:13px;font-weight:700;text-align:right;word-break:break-all}

/* REFER */
.refer-box{background:linear-gradient(135deg,#1a0a3d,#0d0820);border:1.5px dashed #f0c04055;border-radius:14px;padding:14px 16px;margin:10px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.refer-id{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;color:var(--gold2);word-break:break-all}

/* SLOT GRID */
.slot-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.slot-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;transition:border-color .2s;position:relative;overflow:hidden}
.slot-card:active{border-color:var(--gold)}
.slot-cat{font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:6px;text-transform:uppercase}
.slot-mode{font-weight:800;font-size:13px;line-height:1.3;margin-bottom:8px}
.slot-fee{font-size:11px;color:var(--gold2);font-weight:700}

/* ROOM MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal{background:var(--bg3);border:1px solid var(--border2);border-radius:24px 24px 18px 18px;width:100%;max-width:430px;padding:20px;max-height:85vh;overflow-y:auto}
.modal-title{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;margin-bottom:16px;text-align:center}
.room-box{background:rgba(240,192,64,.07);border:1px solid #f0c04040;border-radius:14px;padding:16px;margin:10px 0;text-align:center}
.room-label{font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:6px}
.room-val{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;color:var(--gold2);letter-spacing:2px}


/* ===== GROUP 1 ADDITIONS ===== */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 35%,#1a0a3d,#04050f 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}
.sp-logo{font-size:64px;animation:spPop 1s ease-out both,spGlow 2s ease-in-out infinite}
.sp-title{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;letter-spacing:2px;margin-top:14px;color:#f0eeff}
.sp-title span{color:#f0c040}
.sp-sub{font-size:11px;color:#8b80a8;letter-spacing:4px;margin-top:6px}
.sp-bar{width:140px;height:3px;background:#1e1a35;border-radius:2px;margin-top:26px;overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f0c040,#ffe87a);animation:spLoad 1.6s ease-in-out forwards}
@keyframes spPop{0%{transform:scale(.3) rotate(-25deg);opacity:0}70%{transform:scale(1.15) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes spGlow{0%,100%{filter:drop-shadow(0 0 8px #7c3aed88)}50%{filter:drop-shadow(0 0 22px #f0c040aa)}}
@keyframes spLoad{to{width:100%}}
.bell-btn{position:relative;width:34px;height:34px;border-radius:50%;background:rgba(124,58,237,.14);border:1px solid var(--border2);display:none;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
.bell-badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.bell-ring{animation:ring .7s ease}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(18deg)}40%{transform:rotate(-16deg)}60%{transform:rotate(10deg)}80%{transform:rotate(-6deg)}}
.nt{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--border);cursor:pointer}
.nt:last-child{border:0}
.nt-ico{font-size:20px;width:30px;text-align:center}
.nt-txt{flex:1;font-size:13px;font-weight:600;line-height:1.35}
.nt-time{font-size:10px;color:var(--muted);margin-top:3px;font-weight:500}
.nt.unread{background:rgba(240,192,64,.06);border-radius:10px;padding-left:8px}
.nt.unread .nt-txt::after{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-left:6px}
.cd{font-size:12px;font-weight:800;color:var(--gold2);margin:2px 0 4px;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.cd:empty{display:none}
.win-modal{text-align:center;position:relative;overflow:hidden}
.win-trophy{font-size:72px;animation:spPop 1s ease-out both}
.win-label{font-size:11px;color:var(--muted);letter-spacing:4px;margin-top:6px}
.win-name{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;color:var(--gold2);text-shadow:0 0 24px #f0c04066;margin:6px 0;word-break:break-all}
.confetti{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:41}
.confetti i{position:absolute;top:-16px;width:8px;height:14px;opacity:.95;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);font-weight:600;font-size:14px}
.set-row:last-child{border:0}
.tg{width:46px;height:26px;border-radius:13px;background:var(--border2);position:relative;cursor:pointer;transition:background .2s}
.tg i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.tg.on{background:var(--purple)}
.tg.on i{transform:translateX(20px)}
@media(max-width:380px){.brand-sub{display:none}.brand-text{font-size:12px}.coin-pill{padding:6px 9px}.top-right{gap:7px}}
/* LIGHT THEME */
body.light{--bg:#f5f3ff;--bg2:#ece8fb;--bg3:#ffffff;--text:#1a1433;--muted:#6b6485;--muted2:#4a4266;--border:#ddd6f3;--border2:#cfc6ec;--gold:#c9951a;--gold2:#a8740a;--gold3:#c9951a;--purple3:#6d28d9;--card:linear-gradient(145deg,#ffffff,#f3f0fd);--hero-grad:linear-gradient(135deg,#ede7ff 0%,#e0d4ff 50%,#f5f3ff 100%);--glow:0 0 18px #7c3aed22;--glow-gold:0 0 14px #f0c04033}
body.light .top{background:rgba(255,255,255,.95)}
body.light .nav{background:rgba(255,255,255,.97)}
body.light .coin-pill{background:#fff}
body.light .toast{background:#fff}
body.light .tour-header{background:linear-gradient(135deg,#e6dcff,#f3f0fd)}
body.light .field input{background:#fff}
body.light .auth-tabs{background:#ece8fb}
body.light .wallet-bal,body.light .refer-box{background:linear-gradient(135deg,#efe8ff,#fbf8ff)}
body.light .card-gold{background:linear-gradient(145deg,#fff7e0,#f6f0ff)}
body.light .modal{background:#fff}
body.light .stat-box,body.light .p-stat{background:rgba(124,58,237,.06)}
body.light .notice{color:#7a5a10}
body.light #splash{background:radial-gradient(circle at 50% 35%,#e0d4ff,#f5f3ff 70%)}
body.light .sp-title{color:#1a1433}
body.light .btn-primary,body.light .auth-tab.active{color:#1a0a00}
