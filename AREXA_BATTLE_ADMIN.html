*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#182235,#080b12 48%);color:var(--white);font:15px Arial,sans-serif}
.wrap{max-width:1000px;margin:auto;padding:18px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.bl{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:50%;background:var(--logo) center/cover;box-shadow:0 0 0 2px var(--gold),0 0 14px #ef334466;flex-shrink:0}
.brand{font-weight:900;font-size:20px;letter-spacing:1px}.brand span{color:var(--red)}.sub{font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:4px}
h2{font-size:20px;margin:8px 0 14px}p,.muted{color:var(--muted);line-height:1.5}.card{background:linear-gradient(145deg,#151f30,#0e1521);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
label{display:block;color:#c8d2e1;font-size:13px;margin:12px 0 6px}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #34445c;background:#080e18;color:#fff;font:inherit}
textarea{min-height:85px}.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--red);color:#fff;font-weight:800;cursor:pointer;margin:4px 4px 4px 0}.btn.alt{background:#273449}.btn.good{background:#15803d}.btn.warn{background:#9a3412}.btn.sm{padding:6px 10px;font-size:12px}
.tag{font-size:11px;border:1px solid #46566c;padding:4px 8px;border-radius:20px;color:#d8e1ee}.tag.red{border-color:#ef3340;color:#ef3340}.tag.grn{border-color:#22c55e;color:#22c55e}.tag.gold{border-color:#f5c451;color:#f5c451}
.upi{color:#22c55e;font-weight:700;word-break:break-all}.upi.no{color:#ef3340}
.stat{font-size:24px;font-weight:900;color:var(--gold)}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.small{font-size:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0;position:sticky;top:0;background:#0a0f19;z-index:5}.tabs .btn{white-space:nowrap;margin:0}.tabs .on{background:var(--red)}
.notice{border:1px solid #665327;background:#241e11;color:#f7d98b;padding:12px;border-radius:12px;font-size:13px}
.win{border:1px solid #22c55e66;background:#0f2a1a;color:#86efac;padding:10px 12px;border-radius:12px;font-size:13px;margin:8px 0}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#263449;padding:12px 18px;border-radius:12px;display:none;z-index:9}

<header class="top"><div class="bl"><div class="logo"></div><div class="brand">AREXA <span>BATTLE</span><div class="sub">MAIN ADMIN CONTROLLER</div></div></div><span class="tag">ADMIN PANEL</span></header>

<script>
if(!firebase.apps.length){firebase.initializeApp({apiKey:"AIzaSyDGauX_zs7rsEe2ti2QFgo7z5slg9BL-ck",authDomain:"arexabattle-75a47.firebaseapp.com",databaseURL:"https://arexabattle-75a47-default-rtdb.firebaseio.com",projectId:"arexabattle-75a47",storageBucket:"arexabattle-75a47.firebasestorage.app",messagingSenderId:"1028204149228",appId:"1:1028204149228:web:594d12f5e50c3c1bcc68c9"})}
const db=firebase.database(),CLOUD='arexaBattle/sharedData',SKEY='arexa_admin_session';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=x=>Array.isArray(x)?x:(x&&typeof x==='object'?Object.values(x):[]);
function toast(s){let t=$('toast');if(!t)return;t.textContent=s;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',2500)}
async function sha(s){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const KEYS=['players','tournaments','withdrawals','depositRequests','coinRequests','transactions'];
function norm(d){d=d||{};let o=Object.assign({},d);o.admin=d.admin||{username:'AREXAADMIN',passHash:''};KEYS.forEach(k=>o[k]=arr(d[k]).filter(x=>x&&typeof x==='object'));o.tournaments.forEach(t=>t.players=arr(t.players));o.paymentSettings=d.paymentSettings||{};return o}
let data=norm(null),cloudReady=false,tab=localStorage.getItem('arexa_tab')||'dash',q='',pf='all';
const now=()=>new Date().toLocaleString();
const session=()=>{try{return JSON.parse(localStorage.getItem(SKEY)||'null')}catch{return null}};
const setSession=v=>localStorage.setItem(SKEY,JSON.stringify(v));
function logout(){localStorage.removeItem(SKEY);location.reload()}
/* SAFE SAVE: Firebase transaction. fn() runs on the freshest server data (global `data`), so player joins/deposits are never overwritten. */
function tx(fn){return new Promise(res=>{
  if(!cloudReady){toast('No connection');res({err:'No connection'});return}
  let out=null;
  db.ref(CLOUD).transaction(cur=>{
    out=null;let keep=data;data=norm(cur||keep);let r;
    try{r=fn()||{}}catch(e){data=keep;out={err:'Something went wrong'};return}
    if(r.err){data=keep;out=r;return}
    out=r;let d=data;data=keep;return d},
  (err,ok,snap)=>{
    if(err||!ok){let m=out&&out.err?out.err:'Save failed. Try again.';toast(m);res({err:m});return}
    data=norm(snap.val());render();res(out||{ok:1})},false)})}
async function act(fn,msg){let r=await tx(fn);if(!r.err&&msg)toast(msg);return r}
function getUpi(o){if(!o)return'';for(const k of Object.keys(o)){if(/upi/i.test(k)&&!/status/i.test(k)&&o[k]&&typeof o[k]!=='object')return String(o[k])}return''}
const player=u=>data.players.find(p=>p.username===u);
function upiOf(u,rec){return getUpi(rec)||getUpi(player(u))}
function upiSt(u){let p=player(u);return p&&p.upi?(p.upiStatus||'Pending'):''}
const stTag=s=>s==='Approved'?'<span class="tag grn">✅ Approved</span>':s==='Rejected'?'<span class="tag red">❌ Rejected</span>':s?'<span class="tag gold">⏳ Pending</span>':'';
const upiHtml=(u,uname)=>u?`<span class="upi">UPI: ${esc(u)}</span> <button class="btn alt sm" data-c="${esc(u)}" onclick="navigator.clipboard.writeText(this.dataset.c);toast('UPI copied')">Copy</button> ${uname?stTag(upiSt(uname)):''}`:`<span class="upi no">UPI: not added</span>`;
const isBanned=p=>!!p&&(p.banned||p.blocked||['Banned','Blocked','banned','blocked'].includes(p.status));
async function init(){
  try{let s=await db.ref(CLOUD).once('value');if(s.exists())data=norm(s.val());cloudReady=true;
    db.ref(CLOUD).on('value',s=>{if(!s.exists())return;let a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.id)return;data=norm(s.val());render()});
    toast('Firebase connected ✓')}catch(e){console.error(e);toast('Offline mode')}
  render()}
const TABS=[['dash','📊 Dashboard'],['tour','🏆 Tournaments'],['slots','🎟️ Slots'],['wallet','💰 Wallet'],['players','👥 Players'],['pay','💳 Payment'],['org','🧑‍💼 Organisers']];
function setTab(t){tab=t;q='';localStorage.setItem('arexa_tab',t);render()}
function render(){
  let s=session(),root=$('app');
  if(!s||s.role!=='admin'){root.innerHTML=`<div class="card"><h2>🔐 Admin Login</h2><div class="notice">Username: AREXAADMIN. First time: set 8+ char password.</div><label>Username</label><input id="lu" value="AREXAADMIN"><label>Password</label><input id="lp" type="password"><button class="btn" onclick="doLogin()">Login</button></div>`;return}
  let pd=data.depositRequests.filter(r=>r.status==='Pending'),pw=data.withdrawals.filter(w=>w.status==='Pending'),pu=data.players.filter(p=>p.upi&&(p.upiStatus||'Pending')==='Pending');
  let h=`<div class="tabs">${TABS.map(([k,l])=>`<button class="btn alt ${tab===k?'on':''}" onclick="setTab('${k}')">${l}${k==='wallet'&&(pd.length+pw.length)?' ('+(pd.length+pw.length)+')':''}${k==='players'&&pu.length?' ('+pu.length+')':''}</button>`).join('')}</div>`;
  if(tab==='dash'){
    let dep=data.depositRequests.filter(r=>r.status==='Approved').reduce((a,r)=>a+Number(r.amount||0),0),wd=data.withdrawals.filter(w=>w.status==='Approved').reduce((a,w)=>a+Number(w.coins||0),0),coins=data.players.reduce((a,p)=>a+Number(p.demoCoins||0),0);
    const C=(v,l,st='',go='')=>`<div class="card" ${go?`style="cursor:pointer" onclick="setTab('${go}')"`:''}><div class="stat" ${st?`style="${st}"`:''}>${v}</div><div class="muted">${l}</div></div>`;
    h+=`<div class="grid">${C(data.players.length,'Players','','players')}${C(data.tournaments.length,'Tournaments','','tour')}${C(pd.length,'Pending Deposits','color:#ef3340','wallet')}${C(pw.length,'Pending Withdrawals','','wallet')}${C(pu.length,'Pending UPI Approvals','color:#ef3340','players')}</div>
    <div class="grid">${C('₹'+dep.toLocaleString('en-IN'),'Total Deposits Approved')}${C('🪙'+wd.toLocaleString('en-IN'),'Total Withdrawals Approved')}${C('🪙'+coins.toLocaleString('en-IN'),'Coins With Players')}${C(data.tournaments.filter(t=>t.status==='Open').length,'Open Tournaments')}</div><button class="btn alt" onclick="logout()">Logout</button>`}
  if(tab==='tour')h+=`<div class="card"><h2>🏆 Create Tournament</h2><label>Name</label><input id="tName" placeholder="AREXA Cup"><div class="grid">
    <div><label>Category</label><select id="tCat"><option>BR RANK</option><option>CS CUSTOM</option><option>LONE WOLF</option></select></div>
    <div><label>Game</label><input id="tGame" value="Free Fire"></div>
    <div><label>Mode</label><select id="tMode"><option>BR Survival</option><option>BR Per Kill</option><option>BR Solo Rank</option><option>BR Duo Rank</option><option>BR Squad Rank</option><option>1v1 Custom</option><option>2v2 Custom</option><option>4v4 Custom</option><option>1v1 Headshot Only</option><option>2v2 Headshot Only</option><option>4v4 Headshot Only</option></select></div>
    <div><label>Date & Time</label><input id="tDate" type="datetime-local"></div><div><label>Max Players (Slots)</label><input id="tMax" type="number" value="48"></div><div><label>Entry Fee</label><input id="tFee" type="number" value="0"></div></div>
    <label>Room ID</label><input id="tRoomId"><label>Room Password</label><input id="tRoomPass"><label>Prize</label><input id="tPrize"><label>Rules</label><textarea id="tRules"></textarea>
    <button class="btn good" onclick="createTournament()">Create & Publish</button></div>
    <div class="card"><h2>All Tournaments</h2>${data.tournaments.slice().reverse().map(t=>`<div class="item"><div class="row"><b>${esc(t.name)}</b><span class="tag">${esc(t.status)}</span></div><p class="small muted">${esc(t.game)} • ${esc(t.mode)} • ${t.players.length}/${t.maxPlayers} • Entry 🪙${t.entryFee||0}</p>
    <div class="grid"><div><label>Room ID</label><input id="rid_${t.id}" value="${esc(t.roomId||'')}"></div><div><label>Room Password</label><input id="rpass_${t.id}" value="${esc(t.roomPassword||'')}"></div></div>
    <button class="btn good" onclick="saveRoom(${t.id})">Save Room</button><button class="btn alt" onclick="setStatus(${t.id},'Open')">Open</button><button class="btn warn" onclick="setStatus(${t.id},'Closed')">Close</button><button class="btn warn" style="background:#7f1d1d" onclick="delTour(${t.id})">🗑 Delete</button>
    ${t.winner?`<div class="win">🏆 Winner: <b>${esc(t.winner)}</b>${t.winnerKills?' • '+esc(t.winnerKills)+' kills':''}${t.prizePaid?' • 🪙'+t.prizePaid+' paid':''}</div>`:''}
    <div class="grid" style="margin-top:6px"><div><label>🏆 Winner</label><select id="wn_${t.id}"><option value="">Select player</option>${t.players.map(u=>{u=typeof u==='string'?u:(u&&u.username)||'';return`<option ${u===t.winner?'selected':''}>${esc(u)}</option>`}).join('')}</select></div><div><label>Kills</label><input id="wk_${t.id}" type="number" min="0" value="${esc(t.winnerKills||'')}"></div><div><label>Prize coins (optional)</label><input id="wc_${t.id}" type="number" min="0" placeholder="0"></div></div>
    <button class="btn good" onclick="announceWinner(${t.id})">🏆 Announce Winner</button></div>`).join('')||'<p class="muted">No tournaments.</p>'}</div>`;
  if(tab==='slots')h+=`<div class="card"><h2>🎟️ Slots Management</h2><p class="small">Har tournament ke slots add/remove karo aur joined players ka UPI dekho.</p></div>`+(data.tournaments.map(t=>{let pl=t.players,mx=Number(t.maxPlayers||0);return`<div class="card"><div class="row"><b>${esc(t.name)}</b><span class="tag">${pl.length}/${mx} filled • ${Math.max(mx-pl.length,0)} free</span></div>
    <div class="row" style="margin-top:10px"><input id="sl_${t.id}" type="number" min="1" placeholder="Slots" style="max-width:120px"><button class="btn good" onclick="addSlots(${t.id},1)">➕ Add Slots</button><button class="btn warn" onclick="addSlots(${t.id},-1)">➖ Remove Slots</button></div>
    ${pl.map((x,i)=>{let u=typeof x==='string'?x:(x.username||x.name||'');return`<div class="item small"><b>#${i+1} ${esc(u)}</b><br>${upiHtml(upiOf(u,typeof x==='object'?x:null),u)}</div>`}).join('')||'<p class="muted small">No players joined yet.</p>'}</div>`}).join('')||'<p class="muted">No tournaments.</p>');
  if(tab==='wallet')h+=`<div class="card"><h2>💳 Deposits</h2>${data.depositRequests.slice().reverse().map(r=>`<div class="item"><div class="row"><b>${esc(r.username)} — ₹${r.amount} = ${r.coins} Coins</b><span class="tag">${esc(r.status)}</span></div><p class="small muted">UTR: ${esc(r.utr)} • ${esc(r.created)}</p>${upiHtml(upiOf(r.username,r),r.username)}<br>${r.status==='Pending'?`<button class="btn good" onclick="approveDeposit(${r.id})">✅ Approve</button><button class="btn warn" onclick="rejectDeposit(${r.id})">❌ Reject</button>`:''}</div>`).join('')||'<p class="muted">No deposits.</p>'}</div>
    <div class="card"><h2>💸 Withdrawals</h2>${data.withdrawals.slice().reverse().map(w=>`<div class="item"><div class="row"><b>${esc(w.username)} — 🪙 ${Number(w.coins).toLocaleString('en-IN')}</b><span class="tag">${esc(w.status)}</span></div><p class="small muted">${esc(w.created)}</p>${upiHtml(upiOf(w.username,w),w.username)}<br>${w.status==='Pending'?`<button class="btn good" onclick="approveWithdrawal(${w.id})">✅ Approve (paid)</button><button class="btn warn" onclick="rejectWithdrawal(${w.id})">❌ Reject & refund</button>`:''}</div>`).join('')||'<p class="muted">No withdrawals.</p>'}</div>
    <div class="card"><h2>🧾 Transactions</h2>${data.transactions.slice().reverse().slice(0,50).map(t=>`<div class="item small"><b>${esc(t.username)}</b> • ${esc(t.kind)} • <span class="stat" style="font-size:14px">${t.coins}</span><br><span class="muted">${esc(t.created)}</span></div>`).join('')||'<p class="muted">No transactions.</p>'}</div>`;
  if(tab==='players'){let L=data.players.filter(p=>p.username.toLowerCase().includes(q.toLowerCase())&&(pf==='all'||(pf==='upi'&&p.upi&&(p.upiStatus||'Pending')==='Pending')||(pf==='ban'&&isBanned(p))));
    h+=`<div class="card"><h2>👥 Players & Coins</h2><input id="psearch" placeholder="Search player..." value="${esc(q)}" oninput="q=this.value;render();$('psearch').focus()"><div style="margin-top:8px">${[['all','All'],['upi','⏳ UPI Pending ('+pu.length+')'],['ban','🚫 Banned']].map(([k,l])=>`<button class="btn sm ${pf===k?'':'alt'}" onclick="pf='${k}';render()">${l}</button>`).join('')}</div></div><div class="card"><div id="plist" style="max-height:65vh;overflow-y:auto">${L.map(p=>`<div class="item" data-u="${esc(p.username)}"><div class="row"><b>${esc(p.username)}${isBanned(p)?' <span class="tag red">BANNED</span>':''}</b><span class="tag">🪙 ${Number(p.demoCoins||0).toLocaleString('en-IN')}</span></div>${upiHtml(getUpi(p),p.username)}
    ${p.upi&&(p.upiStatus||'Pending')==='Pending'?`<div style="margin-top:6px"><button class="btn good sm" onclick="setUpi(this,'Approved')">✅ Approve UPI</button><button class="btn warn sm" onclick="setUpi(this,'Rejected')">❌ Reject UPI</button></div>`:p.upi?`<div style="margin-top:6px"><button class="btn alt sm" onclick="setUpi(this,'Pending')">↩ Reset UPI</button></div>`:''}
    <div class="row" style="margin-top:10px"><input type="number" min="1" placeholder="Amount" style="max-width:130px"><button class="btn good" onclick="adjustCoins(this,1)">➕ Add</button><button class="btn warn" onclick="adjustCoins(this,-1)">➖ Deduct</button><button class="btn alt" onclick="setBan(this,${!isBanned(p)})">${isBanned(p)?'✅ Unban':'🚫 Ban'}</button><button class="btn warn" style="background:#7f1d1d" onclick="deletePlayer(this)">🗑 Delete</button></div></div>`).join('')||'<p class="muted">No players.</p>'}</div></div>`}
  if(tab==='pay'){let ps=data.paymentSettings;h+=`<div class="card"><h2>💳 Payment Settings</h2><label>UPI ID</label><input id="payUpi" value="${esc(ps.upiId||'')}"><label>Payee Name</label><input id="payName" value="${esc(ps.payeeName||'')}"><label>Instructions</label><textarea id="payInst">${esc(ps.instructions||'')}</textarea><label>App Download Link (used in Share & Earn)</label><input id="payApk" value="${esc(ps.apkLink||'')}" placeholder="https://..."><label>QR Image</label><input id="payQr" type="file" accept="image/*">${ps.qrData?`<img src="${ps.qrData}" style="width:150px;background:#fff;padding:6px;border-radius:8px;margin-top:8px">`:''}<button class="btn" onclick="savePayment()">Save</button></div>`}
  if(tab==='org')h+=orgHtml();
  let pl=$('plist'),st=pl?pl.scrollTop:0;root.innerHTML=h;let pn=$('plist');if(pn)pn.scrollTop=st}
async function doLogin(){let u=$('lu')?.value.trim(),p=$('lp')?.value;if(!u||!p){toast('Fill all fields');return}
  if(u.toLowerCase()!=='arexaadmin'){toast('Wrong username');return}
  if(!cloudReady){toast('Connecting... try again');return}
  let h=await sha(p);
  if(!data.admin.passHash){if(p.length<8){toast('Password 8+ chars');return}let r=await tx(()=>{if(!data.admin.passHash)data.admin={username:'AREXAADMIN',passHash:h}});if(r.err)return}
  if(data.admin.passHash!==h){toast('Wrong password');return}
  setSession({role:'admin',username:'AREXAADMIN'});render();toast('Welcome Admin!')}
const val=id=>($(id)?.value||'').trim();
function createTournament(){let name=val('tName');if(!name){toast('Enter name');return}
  let t={id:Date.now(),name,category:$('tCat').value,game:val('tGame')||'Free Fire',mode:$('tMode').value,date:$('tDate').value,maxPlayers:Number($('tMax').value||48),entryFee:Number($('tFee').value||0),roomId:val('tRoomId'),roomPassword:val('tRoomPass'),prize:val('tPrize'),rules:val('tRules'),status:'Open',organizer:'AREXAADMIN',players:[],created:now()};
  act(()=>{data.tournaments.push(t)},'Tournament created!')}
const T=id=>data.tournaments.find(x=>x.id===id);
function saveRoom(id){let a=val('rid_'+id),b=val('rpass_'+id);act(()=>{let t=T(id);if(!t)return{err:'Not found'};t.roomId=a;t.roomPassword=b},'Room saved')}
function setStatus(id,s){act(()=>{let t=T(id);if(!t)return{err:'Not found'};t.status=s},'Status: '+s)}
function addSlots(id,dir){let n=Number($('sl_'+id)?.value);if(!n||n<1){toast('Enter valid slots');return}
  act(()=>{let t=T(id);if(!t)return{err:'Not found'};let nm=Number(t.maxPlayers||0)+dir*n;if(nm<t.players.length)return{err:'Joined players se kam slots nahi ho sakte'};t.maxPlayers=nm},dir===1?`✅ ${n} slots added`:`✅ ${n} slots removed`)}
function announceWinner(id){let w=val('wn_'+id),k=val('wk_'+id),c=Math.floor(Number($('wc_'+id)?.value||0));if(!w){toast('Select winner');return}
  act(()=>{let t=T(id),p=player(w);if(!t)return{err:'Not found'};
    if(c>0){if(!p)return{err:'Winner not found'};if(t.prizePaid)return{err:'Prize already paid for this tournament'};p.demoCoins=Number(p.demoCoins||0)+c;t.prizePaid=c;data.transactions.push({id:Date.now(),username:w,kind:'Tournament prize',type:'Credit',coins:c,note:t.name,status:'Completed',created:now()})}
    t.winner=w;t.winnerKills=k;t.status='Completed';t.winnerDate=now()},'🏆 Winner announced')}
function delTour(id){let t=T(id);if(!t)return;let refund=Number(t.entryFee||0)>0&&!t.winner;
  if(!confirm('"'+t.name+'" delete karna hai?'+(refund?'\nJoined players ko entry fee refund hogi.':'')))return;
  act(()=>{let t=T(id);if(!t)return{err:'Not found'};let f=Number(t.entryFee||0);
    if(f>0&&!t.winner)t.players.forEach(u=>{u=typeof u==='string'?u:(u&&u.username);let p=player(u);if(p){p.demoCoins=Number(p.demoCoins||0)+f;data.transactions.push({id:Date.now()+Math.floor(Math.random()*1e4),username:u,kind:'Tournament cancelled - refund',type:'Credit',coins:f,status:'Completed',created:now()})}});
    data.tournaments=data.tournaments.filter(x=>x.id!==id)},'Tournament deleted')}
const rowU=el=>el.closest('.item').dataset.u;
function adjustCoins(el,dir){let u=rowU(el),n=Math.floor(Number(el.closest('.item').querySelector('input').value));if(!n||n<1){toast('Enter valid amount');return}
  act(()=>{let p=player(u);if(!p)return{err:'Player not found'};if(dir===-1&&Number(p.demoCoins||0)<n)return{err:'Not enough coins'};
    p.demoCoins=Number(p.demoCoins||0)+dir*n;data.transactions.push({id:Date.now(),username:u,kind:dir===1?'Admin added coins':'Admin deducted coins',type:dir===1?'Credit':'Debit',coins:dir*n,status:'Completed',created:now()})},'Done')}
function setBan(el,b){let u=rowU(el);if(b&&!confirm('"'+u+'" ko ban karna hai?'))return;act(()=>{let p=player(u);if(!p)return{err:'Not found'};p.banned=b;if(!b)p.blocked=false},b?'🚫 '+u+' banned':'✅ '+u+' unbanned')}
function setUpi(el,st){let u=rowU(el);act(()=>{let p=player(u);if(!p)return{err:'Not found'};p.upiStatus=st},'UPI '+st)}
function deletePlayer(el){let u=rowU(el);if(!confirm('Player "'+u+'" delete karna hai? Ye wapas nahi hoga.'))return;
  act(()=>{data.players=data.players.filter(x=>x.username!==u);data.tournaments.forEach(t=>{t.players=t.players.filter(x=>(typeof x==='string'?x:(x&&x.username))!==u)})},'🗑 '+u+' deleted').then(r=>{if(!r.err){try{db.ref('arexaBattle/presence/'+u.replace(/[.#$\[\]\/]/g,'_')).remove()}catch(e){}}})}
function approveDeposit(id){act(()=>{let r=data.depositRequests.find(x=>x.id===id&&x.status==='Pending');if(!r)return{err:'Already handled'};let p=player(r.username);
  if(!p){r.status='Rejected';r.reviewed=now();return{ok:1}}
  p.demoCoins=Number(p.demoCoins||0)+Number(r.coins);r.status='Approved';r.reviewed=now();
  data.transactions.push({id:Date.now(),username:r.username,kind:'Deposit approved',type:'Credit',coins:Number(r.coins),status:'Completed',created:now()})},'✅ Deposit approved')}
function rejectDeposit(id){act(()=>{let r=data.depositRequests.find(x=>x.id===id&&x.status==='Pending');if(!r)return{err:'Already handled'};r.status='Rejected';r.reviewed=now()},'Rejected')}
function approveWithdrawal(id){act(()=>{let w=data.withdrawals.find(x=>x.id===id&&x.status==='Pending');if(!w)return{err:'Already handled'};w.status='Approved';w.reviewed=now()},'✅ Approved')}
function rejectWithdrawal(id){act(()=>{let w=data.withdrawals.find(x=>x.id===id&&x.status==='Pending');if(!w)return{err:'Already handled'};let p=player(w.username);if(p)p.demoCoins=Number(p.demoCoins||0)+Number(w.coins);
  w.status='Rejected';w.reviewed=now();data.transactions.push({id:Date.now(),username:w.username,kind:'Withdrawal rejected - refunded',type:'Credit',coins:Number(w.coins),status:'Completed',created:now()})},'Rejected, refunded')}
function savePayment(){let upi=val('payUpi'),name=val('payName'),inst=val('payInst'),apk=val('payApk'),f=$('payQr').files[0];
  let fin=qr=>act(()=>{data.paymentSettings=Object.assign({},data.paymentSettings,{upiId:upi,payeeName:name,instructions:inst,apkLink:apk,qrData:qr||data.paymentSettings.qrData||''})},'Saved!');
  if(f){if(f.size>1200000){toast('Image < 1.2MB');return}let r=new FileReader();r.onload=()=>fin(String(r.result));r.readAsDataURL(f)}else fin('')}
const ORG='arexaBattle/organisers',LOGS='arexaBattle/organiserLogs';let orgs={},orgLogs=[];
const okey=u=>String(u).toUpperCase().replace(/[.#$\[\]\/]/g,'_');
const idle=()=>!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'');
db.ref(ORG).on('value',s=>{orgs=s.val()||{};if(idle())render()});
db.ref(LOGS).limitToLast(60).on('value',s=>{orgLogs=Object.values(s.val()||{}).reverse();if(idle())render()});
function orgHtml(){return `<div class="card"><h2>🧑‍💼 Create Organiser ID</h2><label>Username</label><input id="ou" autocapitalize="off"><label>Password (6+)</label><input id="op"><button class="btn good" onclick="addOrg()">Create</button></div>
<div class="card"><h2>Organisers</h2>${Object.entries(orgs).map(([k,o])=>`<div class="item"><div class="row"><b>${esc(o.username)}</b><span class="tag">${o.active===false?'Disabled':'Active'}</span></div><button class="btn alt" onclick="toggleOrg('${k}',${o.active===false})">${o.active===false?'Enable':'Disable'}</button><button class="btn warn" onclick="delOrg('${k}')">Delete</button></div>`).join('')||'<p class="muted">No organisers.</p>'}</div>
<div class="card"><h2>📜 Organiser Live Log</h2>${orgLogs.map(l=>`<div class="item small"><b>${esc(l.organiser)}</b> • ${esc(l.action)}<br><span class="muted">${esc(l.created)}</span></div>`).join('')||'<p class="muted">No activity.</p>'}</div>`}
async function addOrg(){let u=$('ou').value.trim(),p=$('op').value;if(!u||p.length<6){toast('Username + 6+ char password');return}
 await db.ref(ORG+'/'+okey(u)).set({username:u,passHash:await sha(p),active:true,created:now()});toast('Organiser created')}
function toggleOrg(k,a){db.ref(ORG+'/'+k+'/active').set(a)}
function delOrg(k){if(confirm('Delete?'))db.ref(ORG+'/'+k).remove()}
init();
</script></body></html>
