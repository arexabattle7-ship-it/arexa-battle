<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AREXA BATTLE</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04050f;--bg2:#080b1a;--bg3:#0d1128;
  --gold:#f0c040;--gold2:#ffdc45;--gold3:#ffe87a;
  --purple:#7c3aed;--purple2:#a855f7;--purple3:#c084fc;
  --red:#ef4444;--green:#22c55e;--blue:#3b82f6;
  --text:#f0eeff;--muted:#8b80a8;--muted2:#b0a8cc;
  --border:#1e1a35;--border2:#2d2650;
  --card:linear-gradient(145deg,#0d1128,#080b1a);
  --gold-grad:linear-gradient(90deg,#f0c040,#ffdc45,#ffe87a);
  --purple-grad:linear-gradient(135deg,#7c3aed,#a855f7);
  --hero-grad:linear-gradient(135deg,#0d0820 0%,#1a0a3d 50%,#0d1128 100%);
  --glow:0 0 24px #7c3aed55;--glow-gold:0 0 20px #f0c04044;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Rajdhani',Arial,sans-serif;font-size:15px;min-height:100vh;overflow-x:hidden}
.wrap{max-width:430px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:76px;position:relative}
.top{position:sticky;top:0;z-index:20;background:rgba(4,5,15,0.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border2);padding:0 16px}
.top-inner{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:34px;height:34px;background:var(--purple-grad);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:var(--glow)}
.brand-text{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:900;letter-spacing:1px;color:var(--text)}
.brand-text span{color:var(--gold)}
.brand-sub{font-size:9px;color:var(--muted);letter-spacing:2px;margin-top:1px}
.top-right{display:flex;align-items:center;gap:10px}
.coin-pill{background:linear-gradient(135deg,#1a1430,#0d1128);border:1px solid var(--border2);border-radius:20px;padding:6px 12px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:var(--gold2)}
.coin-pill .coin-icon{font-size:14px}
.avatar-btn{width:34px;height:34px;border-radius:50%;background:var(--purple-grad);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;box-shadow:var(--glow-gold)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);background:rgba(4,5,15,0.97);backdrop-filter:blur(20px);border-top:1px solid var(--border2);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 4px;z-index:20;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.nav-btn{border:0;background:none;color:var(--muted);font-size:9px;font-family:'Rajdhani',sans-serif;font-weight:600;padding:4px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s;letter-spacing:.5px;text-transform:uppercase}
.nav-btn .ico{font-size:20px;line-height:1}
.nav-btn.active{color:var(--gold2)}
.nav-btn.active .ico{filter:drop-shadow(0 0 6px #f0c04099)}
#app{padding:0}
.hero-section{background:var(--hero-grad);padding:20px 16px 24px;position:relative;overflow:hidden;border-bottom:1px solid var(--border2)}
.hero-section::before{content:'';position:absolute;top:-40px;right:-40px;width:200px;height:200px;background:radial-gradient(circle,#7c3aed22,transparent 70%);border-radius:50%;pointer-events:none}
.hero-section::after{content:'';position:absolute;bottom:-30px;left:-30px;width:160px;height:160px;background:radial-gradient(circle,#f0c04015,transparent 70%);border-radius:50%;pointer-events:none}
.hero-greet{font-size:12px;color:var(--muted2);letter-spacing:1px;margin-bottom:4px}
.hero-name{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;line-height:1.1;margin-bottom:14px}
.hero-name span{color:var(--gold)}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-box{background:rgba(255,255,255,0.04);border:1px solid var(--border2);border-radius:14px;padding:12px 10px;text-align:center;position:relative;overflow:hidden}
.stat-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--gold-grad);opacity:.7}
.stat-val{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;color:var(--gold2);line-height:1}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:.5px}
.hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-primary{border:0;border-radius:12px;padding:13px 16px;background:var(--gold-grad);color:#1a0a00;font-size:14px;font-weight:900;cursor:pointer;width:100%;font-family:'Rajdhani',sans-serif;letter-spacing:.5px;box-shadow:var(--glow-gold);transition:opacity .2s}
.btn-primary:active{opacity:.85}
.btn-secondary{border:1px solid var(--border2);border-radius:12px;padding:13px 16px;background:rgba(124,58,237,.12);color:var(--purple3);font-size:14px;font-weight:700;cursor:pointer;width:100%;font-family:'Rajdhani',sans-serif;letter-spacing:.5px;transition:border-color .2s}
.btn-secondary:active{border-color:var(--purple2)}
.btn-outline{border:1px solid var(--border2);border-radius:10px;padding:10px 14px;background:transparent;color:var(--muted2);font-size:13px;font-weight:600;cursor:pointer;font-family:'Rajdhani',sans-serif;transition:border-color .2s;width:100%;margin-top:6px}
.btn-outline:active{border-color:var(--gold)}
.section{padding:16px}
.section-title{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.card-gold{border-color:#f0c04030;background:linear-gradient(145deg,#1a1020,#0d0820)}
.card-gold::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--gold-grad);opacity:.5}
.tour-card{background:var(--card);border:1px solid var(--border);border-radius:18px;margin-bottom:14px;overflow:hidden;position:relative}
.tour-header{padding:14px 16px 10px;background:linear-gradient(135deg,#1a0a3d,#0d1128)}
.tour-header::after{content:'';position:absolute;top:0;right:0;width:80px;height:80px;background:radial-gradient(circle,#7c3aed20,transparent);border-radius:50%}
.tour-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(124,58,237,.2);border:1px solid #7c3aed55;border-radius:20px;padding:4px 10px;font-size:10px;color:var(--purple3);font-weight:700;letter-spacing:.5px;margin-bottom:8px}
.tour-name{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:900;line-height:1.2;margin-bottom:4px}
.tour-meta{font-size:11px;color:var(--muted2)}
.tour-body{padding:12px 16px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--border)}
.tour-stat{text-align:center}
.tour-stat-val{font-weight:900;font-size:16px;color:var(--gold2)}
.tour-stat-lbl{font-size:9px;color:var(--muted);letter-spacing:.5px;margin-top:2px}
.tour-footer{padding:10px 16px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status-badge{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:4px 10px;font-size:10px;font-weight:700;letter-spacing:.5px}
.status-open{background:rgba(34,197,94,.12);border:1px solid #22c55e44;color:#22c55e}
.status-closed{background:rgba(239,68,68,.12);border:1px solid #ef444444;color:#ef4444}
.status-done{background:rgba(107,114,128,.12);border:1px solid #6b728044;color:#9ca3af}
.live-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.8)}}
.lb-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.lb-row:last-child{border:0}
.lb-rank{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;width:28px;text-align:center;color:var(--muted)}
.lb-rank.top1{color:#ffd700;text-shadow:0 0 10px #ffd70088}
.lb-rank.top2{color:#c0c0c0}
.lb-rank.top3{color:#cd7f32}
.lb-avatar{width:36px;height:36px;border-radius:50%;background:var(--purple-grad);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;border:1.5px solid var(--border2)}
.lb-info{flex:1;min-width:0}
.lb-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-sub{font-size:11px;color:var(--muted)}
.lb-coins{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;color:var(--gold2)}
.wallet-bal{text-align:center;padding:20px;background:linear-gradient(135deg,#1a0a3d,#0d0820);border-radius:18px;border:1px solid #f0c04025;position:relative;overflow:hidden;margin-bottom:14px}
.wallet-bal::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:radial-gradient(circle,#f0c04020,transparent);border-radius:50%}
.bal-label{font-size:11px;color:var(--muted);letter-spacing:2px;margin-bottom:8px}
.bal-amount{font-family:'Orbitron',sans-serif;font-size:36px;font-weight:900;color:var(--gold2);text-shadow:0 0 30px #f0c04055;line-height:1}
.bal-sub{font-size:11px;color:var(--muted2);margin-top:6px}
.field{margin:12px 0}
.field label{display:block;font-size:12px;color:var(--muted2);letter-spacing:.5px;margin-bottom:7px;font-weight:600}
.field input{width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--border2);background:rgba(13,17,40,.8);color:var(--text);font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:500;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--purple2)}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:rgba(13,17,40,.8);border-radius:14px;padding:4px;margin-bottom:16px}
.auth-tab{border:0;border-radius:11px;padding:12px;font-weight:800;font-size:14px;cursor:pointer;font-family:'Rajdhani',sans-serif;transition:all .2s}
.auth-tab.active{background:var(--gold-grad);color:#1a0a00}
.auth-tab:not(.active){background:none;color:var(--muted2)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a1430;border:1px solid var(--purple2);border-radius:14px;padding:12px 18px;display:none;z-index:30;font-size:13px;font-weight:600;text-align:center;max-width:88%;box-shadow:0 4px 24px #7c3aed44;color:var(--text)}
.notice{background:rgba(240,192,64,.06);border:1px solid #f0c04030;border-radius:14px;padding:14px;font-size:13px;color:#f0c090;line-height:1.5;margin:12px 0}
.notice b{color:var(--gold2)}
.profile-banner{background:var(--hero-grad);border-radius:18px;padding:20px 16px;text-align:center;border:1px solid var(--border2);margin-bottom:12px;position:relative;overflow:hidden}
.profile-banner::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--gold-grad)}
.p-avatar{font-size:52px;margin-bottom:8px;line-height:1}
.p-name{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;margin-bottom:3px}
.p-username{font-size:12px;color:var(--muted2)}
.p-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.p-stat{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center}
.p-stat-val{font-family:'Orbitron',sans-serif;font-size:17px;font-weight:900;color:var(--gold2)}
.p-stat-lbl{font-size:9px;color:var(--muted);margin-top:3px;letter-spacing:.5px}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);gap:12px}
.info-row:last-child{border:0}
.info-label{font-size:12px;color:var(--muted);flex-shrink:0}
.info-val{font-size:13px;font-weight:700;text-align:right;word-break:break-all}
.refer-box{background:linear-gradient(135deg,#1a0a3d,#0d0820);border:1.5px dashed #f0c04055;border-radius:14px;padding:14px 16px;margin:10px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.refer-id{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;color:var(--gold2);word-break:break-all}
.slot-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.slot-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;transition:border-color .2s;position:relative;overflow:hidden}
.slot-card:active{border-color:var(--gold)}
.slot-cat{font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:6px;text-transform:uppercase}
.slot-mode{font-weight:800;font-size:13px;line-height:1.3;margin-bottom:8px}
.slot-fee{font-size:11px;color:var(--gold2);font-weight:700}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal{background:var(--bg3);border:1px solid var(--border2);border-radius:24px 24px 18px 18px;width:100%;max-width:430px;padding:20px;max-height:85vh;overflow-y:auto}
.modal-title{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;margin-bottom:16px;text-align:center}
.room-box{background:rgba(240,192,64,.07);border:1px solid #f0c04040;border-radius:14px;padding:16px;margin:10px 0;text-align:center}
.room-label{font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:6px}
.room-val{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;color:var(--gold2);letter-spacing:2px}
#splash{position:fixed;inset:0;z-index:100;background:#04050f;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}
#splash img{width:190px;height:190px;border-radius:50%;box-shadow:0 0 40px #ef444488;animation:sp 1.6s ease-in-out infinite}
@keyframes sp{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.sp-bar{width:160px;height:4px;background:#1e1a35;border-radius:2px;margin-top:28px;overflow:hidden}
.sp-bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#f0c040,#ffdc45);border-radius:2px;animation:spb 1.1s linear infinite}
@keyframes spb{0%{margin-left:-40%}100%{margin-left:100%}}
.sp-txt{font-size:11px;color:#8b80a8;letter-spacing:3px;margin-top:12px}
::-webkit-scrollbar{width:0}

function toast(s){let t=$('toast');if(!t)return;t.textContent=s;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',2500)}
async function sha(s){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function arr(x){return Array.isArray(x)?x:(x&&typeof x==='object'?Object.values(x):[])}
function normalize(d){d=d||{};let o=Object.assign({},d);o.admin=d.admin||{username:'AREXAADMIN',passHash:''};['players','tournaments','withdrawals','depositRequests','coinRequests','transactions'].forEach(k=>{o[k]=arr(d[k]).filter(x=>x&&typeof x==='object')});o.paymentSettings=d.paymentSettings||{};o.tournaments.forEach(t=>{t.players=arr(t.players)});return o}
let data=normalize(null);
try{let cc=JSON.parse(localStorage.getItem(STORE)||'null');if(cc)data=normalize(cc)}catch(e){}
function session(){try{return JSON.parse(localStorage.getItem(SKEY)||'null')}catch(e){return null}}
function setSession(v){localStorage.setItem(SKEY,JSON.stringify(v))}
function logout(){localStorage.removeItem(SKEY);location.reload()}
function me(){let s=session();if(!s)return null;return data.players.find(x=>x.username===s.username)||null}
function saveLocal(){try{localStorage.setItem(STORE,JSON.stringify(data))}catch(e){}}
function isBlocked(p){return!!p&&(p.banned||p.blocked||['Banned','Blocked','banned','blocked'].includes(p.status))}
// NOTE: fn must be a normal (non-async) function, transaction cannot wait for promises.
function mutate(fn){
  return new Promise(resolve=>{
    if(!cloudReady||!db){resolve({err:'No internet. Please try again.'});return}
    if(busy){resolve({err:'Please wait...'});return}
    busy=true;let out=null,done=false;
    let finish=r=>{if(done)return;done=true;busy=false;resolve(r)};
    let timer=setTimeout(()=>finish({err:'Slow connection. Check your wallet before retrying.'}),12000);
    db.ref(CLOUD).transaction(cur=>{
      out=null;let d=normalize(cur||JSON.parse(JSON.stringify(data)));
      let r;try{r=fn(d)||{}}catch(e){out={err:'Something went wrong'};return}
      if(r.err){out=r;return}out=r;return d;
    },(err,committed,snap)=>{
      clearTimeout(timer);
      if(err){finish({err:'Save failed. Try again.'});return}
      if(!committed){finish(out&&out.err?out:{err:'Please try again'});return}
      data=normalize(snap.val());saveLocal();finish(out||{ok:true});
    },false);
  });
}

const UPI_RE=/^[\w.\-]{2,}@[a-zA-Z]{2,}$/;

function typing(){let a=document.activeElement;return!!a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')}
function softRender(){if(typing()||editProf){pendingRender=true}else render()}
document.addEventListener('focusout',()=>{if(pendingRender)setTimeout(()=>{if(!typing()&&!editProf){pendingRender=false;render()}},250)});

function switchTab(t){tab=t;render()}

function updateTopBar(){let c=me();let topAv=$('topAvatar');let topCoin=$('topCoinVal');if(c&&topAv){topAv.textContent=c.avatar||'🎮'}if(c&&topCoin){topCoin.textContent=Number(c.demoCoins||0).toLocaleString('en-IN')}}

function render(){
  let root=$('app'),nav=$('nav');
  updateTopBar();
  let s=session(),c=me();
  if(!s||!c){
    nav.style.display='none';
    root.innerHTML=loginView();
    return;
  }
  if(isBlocked(c)){root.innerHTML=`<div style="padding:40px 20px;text-align:center"><div style="font-size:48px;margin-bottom:16px">🚫</div><div style="font-family:'Orbitron',sans-serif;font-size:18px;color:#ef4444;margin-bottom:8px">Account Suspended</div><p style="color:var(--muted)">Your account has been blocked. Contact support.</p><button class="btn-outline" onclick="logout()">Logout</button></div>`;nav.style.display='none';return}
  nav.style.display='grid';
  ['home','tournaments','wallet','leaderboard','profile'].forEach(t=>{let b=$('nb-'+t);if(b)b.className='nav-btn'+(tab===t?' active':'')});
  if(tab==='home')root.innerHTML=homeView(c);
  else if(tab==='tournaments')root.innerHTML=tourView(c);
  else if(tab==='wallet')root.innerHTML=walletView(c);
  else if(tab==='leaderboard')root.innerHTML=lbView(c);
  else if(tab==='profile'){if(editProf)root.innerHTML=editView(c);else root.innerHTML=profileView(c)}
}

function startEdit(){editProf=true;pickAv='';render()}
function cancelEdit(){editProf=false;render()}
function toggleAvatarPicker(){let p=$('avpicker');if(p)p.style.display=p.style.display==='none'?'flex':'none'}

async function saveEdit(){
  let c=me();if(!c)return;
  let upi=$('eupi').value.trim();
  if(upi&&!UPI_RE.test(upi)){toast('Invalid UPI ID format');return}
  let upiChanged=upi&&upi!==c.upi;
  let res=await mutate(d=>{
    let p=d.players.find(x=>x.username===c.username);if(!p)return{err:'Not found'};
    p.fullName=$('ef').value.trim()||p.fullName;
    p.gameName=$('eg').value.trim()||p.gameName;
    p.gameUid=$('eu').value.trim()||p.gameUid;
    p.phone=$('ep').value.trim()||p.phone;
    p.email=$('ee').value.trim()||p.email;
    if(pickAv)p.avatar=pickAv;
    if(upiChanged){p.upi=upi;p.upiStatus='Pending'}
  });
  if(res.err){toast(res.err);return}
  editProf=false;pickAv='';toast('Profile saved ✓');render()
}

async function doLogin(){
  let u=$('lu')?.value.trim(),p=$('lp')?.value;
  if(!u||!p){toast('Fill all fields');return}
  if(!cloudReady){toast('Connecting... please wait');return}
  let pl=data.players.find(x=>x.username.toLowerCase()===u.toLowerCase());
  if(!pl||pl.passHash!==await sha(p)){toast('Wrong username or password');return}
  if(isBlocked(pl)){toast('Account blocked. Contact support.');return}
  setSession({username:pl.username});toast('Welcome back! 🎮');render()
}

async function signup(){
  let u=$('nu')?.value.trim(),p=$('np')?.value,r=$('nr')?.value.trim();
  if(!u||!p){toast('Fill required fields');return}
  if(u.length<3){toast('Username min 3 chars');return}
  if(p.length<8){toast('Password min 8 chars');return}
  if(!cloudReady){toast('Connecting... please wait');return}
  // FIX: hash pehle nikalo, transaction ke andar async nahi chalta
  let hash=await sha(p);
  let res=await mutate(d=>{
    if(d.players.find(x=>x.username.toLowerCase()===u.toLowerCase()))return{err:'Username already taken'};
    let ref=r?d.players.find(x=>x.username.toLowerCase()===r.toLowerCase()):null;
    d.players.push({username:u,passHash:hash,demoCoins:0,points:0,avatar:'🎮',referredBy:ref?ref.username:'',refEarned:0,created:new Date().toLocaleString()});
    if(ref){ref.demoCoins=Number(ref.demoCoins||0)+REF_BONUS;ref.refEarned=Number(ref.refEarned||0)+REF_BONUS}
  });
  if(res.err){toast(res.err);return}
  let pl=data.players.find(x=>x.username.toLowerCase()===u.toLowerCase());
  if(pl){setSession({username:pl.username});toast('Account created! 🎉');render()}
}

async function joinTour(id){
  let c=me();if(!c){toast('Login required');return}
  let t=data.tournaments.find(x=>x.id===id);
  if(!t){toast('Tournament not found');return}
  if(t.players.includes(c.username)){showRoom(id);return}
  if(t.players.length>=t.maxPlayers){toast('Tournament is full');return}
  if(t.status!=='Open'){toast('Tournament is closed');return}
  let fee=Number(t.entryFee||0);
  if(fee>0&&Number(c.demoCoins||0)<fee){toast(`Need ${fee} coins to join`);return}
  let res=await mutate(d=>{
    let tour=d.tournaments.find(x=>x.id===id),p=d.players.find(x=>x.username===c.username);
    if(!tour||!p)return{err:'Not found'};
    if(tour.players.includes(p.username))return{err:'Already joined'};
    if(tour.players.length>=tour.maxPlayers)return{err:'Full'};
    if(fee>0){if(Number(p.demoCoins||0)<fee)return{err:'Not enough coins'};p.demoCoins=Number(p.demoCoins||0)-fee;d.transactions.push({id:Date.now(),username:p.username,kind:'Tournament entry',type:'Debit',coins:-fee,note:tour.name,status:'Completed',created:new Date().toLocaleString()})}
    tour.players.push(p.username);
  });
  if(res.err){toast(res.err);return}
  toast('Joined! 🎉');showRoom(id)
}

function showRoom(id){
  let t=data.tournaments.find(x=>x.id===id);if(!t)return;
  let c=me(),joined=t.players.includes(c?c.username:'');
  let m=document.createElement('div');m.className='modal-overlay';m.id='modal';
  m.innerHTML=`<div class="modal">
    <div class="modal-title">${esc(t.name)}</div>
    <div class="tour-badge" style="display:flex;justify-content:center;margin-bottom:12px"><span class="live-dot"></span>${esc(t.status)}</div>
    ${joined&&t.roomId?`<div class="room-box"><div class="room-label">ROOM ID</div><div class="room-val">${esc(t.roomId)}</div></div>`:''}
    ${joined&&t.roomPassword?`<div class="room-box"><div class="room-label">ROOM PASSWORD</div><div class="room-val">${esc(t.roomPassword)}</div></div>`:''}
    ${!joined||(!t.roomId&&!t.roomPassword)?`<div class="notice">Room details will appear here once the organizer publishes them.</div>`:''}
    ${t.prize?`<div style="text-align:center;padding:10px 0"><span style="font-size:11px;color:var(--muted)">Prize</span><div style="font-size:18px;font-weight:900;color:var(--gold2)">${esc(t.prize)}</div></div>`:''}
    ${t.rules?`<div class="card" style="font-size:12px;color:var(--muted2);line-height:1.6">${esc(t.rules)}</div>`:''}
    <button class="btn-outline" onclick="closeModal()">Close</button>
  </div>`;
  document.body.appendChild(m);m.onclick=e=>{if(e.target===m)closeModal()}
}
function closeModal(){let m=$('modal');if(m)m.remove()}

function showDeposit(){
  let ps=data.paymentSettings||{};
  let m=document.createElement('div');m.className='modal-overlay';m.id='modal';
  m.innerHTML=`<div class="modal">
    <div class="modal-title">➕ Deposit Coins</div>
    ${ps.upiId?`<div class="room-box"><div class="room-label">PAY TO UPI</div><div class="room-val" style="font-size:16px">${esc(ps.upiId)}</div>${ps.payeeName?`<div style="font-size:12px;color:var(--muted);margin-top:4px">${esc(ps.payeeName)}</div>`:''}</div>`:`<div class="notice">Payment UPI not set yet. Contact admin.</div>`}
    ${ps.qrData?`<img src="${ps.qrData}" style="width:160px;border-radius:12px;display:block;margin:12px auto;background:#fff;padding:8px">`:''}
    ${ps.instructions?`<div class="notice">${esc(ps.instructions)}</div>`:''}
    <div class="field"><label>Amount (₹)</label><input type="number" id="damt" min="1" placeholder="Enter amount"></div>
    <div class="field"><label>UTR / Transaction ID</label><input id="dutr" placeholder="12-digit UTR number"></div>
    <button class="btn-primary" onclick="submitDeposit()">Submit Request</button>
    <button class="btn-outline" onclick="closeModal()">Cancel</button>
  </div>`;
  document.body.appendChild(m);m.onclick=e=>{if(e.target===m)closeModal()}
}

async function submitDeposit(){
  let amt=Number($('damt')?.value),utr=$('dutr')?.value.trim();
  if(!amt||amt<1){toast('Enter valid amount');return}
  if(!utr){toast('Enter UTR number');return}
  let coins=Math.floor(amt);
  let c=me();if(!c)return;
  let res=await mutate(d=>{d.depositRequests.push({id:Date.now(),username:c.username,amount:amt,coins,utr,status:'Pending',created:new Date().toLocaleString()})});
  if(res.err){toast(res.err);return}
  closeModal();toast('Deposit request submitted ✓')
}

function showWithdraw(){
  let c=me();if(!c)return;
  let m=document.createElement('div');m.className='modal-overlay';m.id='modal';
  m.innerHTML=`<div class="modal">
    <div class="modal-title">💸 Withdraw</div>
    <div class="wallet-bal" style="padding:14px;margin-bottom:14px"><div class="bal-label">AVAILABLE</div><div class="bal-amount" style="font-size:28px">🪙 ${Number(c.demoCoins||0).toLocaleString('en-IN')}</div></div>
    ${!c.upi?`<div class="notice">⚠️ Add your UPI ID in profile first to withdraw.</div><button class="btn-secondary" onclick="closeModal();editProf=true;tab='profile';render()">Add UPI ID</button>`:`
    <div style="font-size:13px;color:var(--muted2);margin-bottom:12px">UPI: <b style="color:var(--gold2)">${esc(c.upi)}</b> ${c.upiStatus==='Approved'?'<span style="color:var(--green)">✅</span>':c.upiStatus==='Rejected'?'<span style="color:#ef4444">❌ Rejected</span>':'<span style="color:var(--gold2)">⏳ Pending approval</span>'}</div>
    ${c.upiStatus!=='Approved'?`<div class="notice">Your UPI is not approved yet. Contact admin.</div>`:`
    <div class="field"><label>Coins to Withdraw</label><input type="number" id="wcoins" min="1" max="${c.demoCoins}" placeholder="Enter coins"></div>
    <button class="btn-primary" onclick="submitWithdraw()">Request Withdrawal</button>`}`}
    <button class="btn-outline" onclick="closeModal()">Cancel</button>
  </div>`;
  document.body.appendChild(m);m.onclick=e=>{if(e.target===m)closeModal()}
}

async function submitWithdraw(){
  let c=me();if(!c)return;
  let coins=Math.floor(Number($('wcoins')?.value));
  if(!coins||coins<1){toast('Enter valid amount');return}
  if(coins>Number(c.demoCoins||0)){toast('Not enough coins');return}
  let res=await mutate(d=>{
    let p=d.players.find(x=>x.username===c.username);if(!p)return{err:'Not found'};
    if(coins>Number(p.demoCoins||0))return{err:'Not enough coins'};
    p.demoCoins=Number(p.demoCoins||0)-coins;
    d.withdrawals.push({id:Date.now(),username:c.username,coins,upi:c.upi,status:'Pending',created:new Date().toLocaleString()});
    d.transactions.push({id:Date.now()+1,username:c.username,kind:'Withdrawal requested',type:'Debit',coins:-coins,status:'Pending',created:new Date().toLocaleString()});
  });
  if(res.err){toast(res.err);return}
  closeModal();toast('Withdrawal request sent ✓')
}

function sortedPlayers(){return data.players.filter(p=>!isBlocked(p)).sort((a,b)=>(Number(b.demoCoins)||0)-(Number(a.demoCoins)||0)||(Number(b.points)||0)-(Number(a.points)||0)||String(a.username).localeCompare(String(b.username)))}

async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){try{let a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();let ok=document.execCommand('copy');a.remove();return ok}catch(_){return false}}}
function appLink(){let ps=data.paymentSettings||{};return ps.apkLink?String(ps.apkLink):''}
function shareText(code){let l=appLink();return '⚔️ AREXA BATTLE — Play tournaments & win!\n'+(l?'📲 Download: '+l+'\n':'')+(code?'🎁 Refer ID: '+code+'\n(Enter this when creating account)':'')}
async function copyCode(){let c=me();if(!c)return;if(await copyText(c.username))toast('Refer ID copied ✓')}
async function shareApp(){
  let c=me(),text=shareText(c?c.username:'');
  try{if(navigator.share){await navigator.share({title:'AREXA BATTLE',text});return}}catch(e){if(e&&e.name==='AbortError')return}
  if(await copyText(text))toast('Invite text copied ✓');else toast('Share manually from profile')
}

let startPresenceDone=false;
function startPresence(){
  if(startPresenceDone||!db)return;
  let s=session();if(!s)return;
  startPresenceDone=true;
  try{
    let ref=db.ref('arexaBattle/presence/'+s.username.replace(/[.#$\[\]\/]/g,'_'));
    let TS=firebase.database.ServerValue.TIMESTAMP;
    db.ref('.info/connected').on('value',sn=>{
      if(sn.val()===true){ref.onDisconnect().set({username:s.username,online:false,lastSeen:TS}).catch(()=>{});ref.set({username:s.username,online:true,lastSeen:TS}).catch(()=>{})}
    });
  }catch(e){}
}

async function init(){
  loaded=true;render();
  let first=true;
  if(!(await ensureFirebase())){toast('Offline mode');return}
  await new Promise(res=>{
    let t=setTimeout(()=>{toast('Offline mode');res()},8000);
    try{
      db.ref(CLOUD).on('value',snap=>{
        cloudReady=true;
        if(snap.exists()){data=normalize(snap.val());saveLocal()}
        if(first){first=false;clearTimeout(t);toast('Connected ✓');res()}
        softRender();
      },err=>{netErr='DB error: '+(err&&err.code?err.code:'unknown');clearTimeout(t);res()});
    }catch(e){netErr=e&&e.message?e.message:String(e);clearTimeout(t);res()}
  });
  startPresence();
}
let loaded=false;
const splashStart=Date.now();
function hideSplash(){let s=$('splash');if(!s)return;let w=Math.max(0,1800-(Date.now()-splashStart));setTimeout(()=>{s.classList.add('hide');setTimeout(()=>s.remove(),600)},w)}
init().then(hideSplash,hideSplash);
setTimeout(hideSplash,12000);
</script>
</body></html>
